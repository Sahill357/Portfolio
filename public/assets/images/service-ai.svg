<?xml version="1.0" encoding="UTF-8"?>
<svg width="80px" height="80px" viewBox="0 0 80 80" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>AI & Machine Learning</title>
  <g fill="none" fill-rule="evenodd">
