    <path d="M54 36 L52 50" stroke="#E48E66" stroke-width="1.8" stroke-dasharray="2,2"/>
    
    <!-- Neural Nodes (Circles) -->
    <circle cx="38" cy="24" r="3.5" fill="#FFFFFF"/>
    <circle cx="42" cy="24" r="3.5" fill="#FFFFFF"/>
    <circle cx="38" cy="36" r="4" fill="#FF4C60"/>
    <circle cx="42" cy="36" r="4" fill="#FFCF06"/>
