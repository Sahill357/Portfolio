    <circle cx="42" cy="48" r="3.5" fill="#FFFFFF"/>
    
    <circle cx="24" cy="22" r="3.5" fill="#FF4C60"/>
    <circle cx="18" cy="30" r="4" fill="#FFCF06"/>
    <circle cx="26" cy="36" r="3" fill="#FFFFFF"/>
